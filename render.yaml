services:
  # Backend WebSocket + API server
  - type: web
    name: skribbl-clone-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        fromDatabase:
          name: skribbl-mongo
          property: connectionString
      - key: FRONTEND_URL
        value: https://your-skribbl-frontend.onrender.com   # update after deploy

  # Frontend static site
  - type: web
    name: skribbl-clone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://your-skribbl-backend.onrender.com   # update after deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: skribbl-mongo
    databaseName: skribbl_clone
    plan: free
