version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: skribbl-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: skribbl-clone

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skribbl-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/skribbl-clone
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skribbl-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
